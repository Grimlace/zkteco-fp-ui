name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (incl. pyinstaller)
        run: uv sync --group dev

      - name: Build single-file EXE
        run: uv run --group dev pyinstaller zkteco-ui.spec --noconfirm --distpath dist --workpath build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZKTecoController-windows-x64
          path: dist/ZKTecoController.exe

      - name: Create/update GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZKTecoController.exe
          generate_release_notes: true