[project]
name = "zkteco"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.1",
    "pyzk>=0.9",
    "openpyxl>=3.1.5",
]

[project.scripts]
zkteco = "zkteco.cli:main"
zkteco-ui = "zkteco.ui.app:run_ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zkteco"]
